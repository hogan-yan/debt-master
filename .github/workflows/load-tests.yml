name: Load Tests

# Manual only: load tests run against a URL you name, so there is no
# automatic production target. Note: hosted-lane CI is currently blocked by
# the billing issue — run `k6` locally until that's fixed.
on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target base URL (dev/staging only — never production)'
        required: true
      test:
        description: 'Test to run'
        required: true
        default: 'smoke.js'
        type: choice
        options:
          - smoke.js
          - journey.js
          - stress.js
          - spike.js

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run load test
        working-directory: apps/web
        run: k6 run --out json=results.json load-tests/${{ inputs.test }}
        env:
          BASE_URL: ${{ inputs.target_url }}
          SESSION_COOKIE: ${{ secrets.LOAD_TEST_SESSION_COOKIE || '' }}

      - name: Summarize results
        if: always()
        working-directory: apps/web
        run: node load-tests/analyze-results.js results.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: apps/web/results.json
          if-no-files-found: ignore
